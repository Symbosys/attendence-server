name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build both 'latest' and the specific build number tag
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/attendance-hrm:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/attendance-hrm:${{ github.run_number }} .

      # Push both tags to Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/attendance-hrm:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/attendance-hrm:${{ github.run_number }}

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /root/Symbosys/Attendence-HRM

            # Dynamically update the image tag in docker-compose.yaml to the current build number
            sed -i 's|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/attendance-hrm:${{ github.run_number }}|g' docker-compose.yaml

            # Pull the newly pushed image using the build number tag
            docker pull ${{ secrets.DOCKER_USERNAME }}/attendance-hrm:${{ github.run_number }}

            # Restart the container
            docker compose down
            docker compose up -d

            echo "========================================="
            echo "🚀 Deployment Successful (Build #${{ github.run_number }})!"
            echo "========================================="